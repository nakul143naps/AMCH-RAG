services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amch-rag-app
    restart: unless-stopped
    ports:
      - "80:8000"
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 600M

  qdrant:
    image: qdrant/qdrant:latest
    container_name: amch-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 300M

volumes:
  qdrant_storage:
