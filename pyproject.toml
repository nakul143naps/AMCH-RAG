[project]
name = "amch-rag"
version = "0.1.0"
description = "Agentic Multi-Modal Corrective Hybrid RAG (AMCH-RAG)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.20",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "redis>=5.2.0",
    "google-genai>=1.0.0",
    "groq>=0.18.0",
    "openai>=1.60.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "duckduckgo-search>=7.3.0",
    "streamlit>=1.41.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false
link-mode = "copy"
